name: Release

# A v* tag publishes a release. Pull requests that touch this file only build.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # gh picks an extension binary by its "<os>-<arch>" suffix.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      - run: cargo test --locked
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - run: |
          mkdir dist
          for pair in x86_64:amd64 aarch64:arm64; do
            target="${pair%:*}-unknown-linux-musl"
            cargo build --release --locked --target "$target"
            cp "target/$target/release/ghdeck" "dist/gh-deck-linux-${pair#*:}"
          done
          dist/gh-deck-linux-amd64 --version
      - name: Create draft release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes dist/*

  macos:
    needs: linux
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: |
          mkdir dist
          for pair in x86_64:amd64 aarch64:arm64; do
            target="${pair%:*}-apple-darwin"
            cargo build --release --locked --target "$target"
            cp "target/$target/release/ghdeck" "dist/gh-deck-darwin-${pair#*:}"
          done
          dist/gh-deck-darwin-arm64 --version
      - name: Upload and publish
        if: github.ref_type == 'tag'
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
